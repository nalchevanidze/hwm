# hash: c312d7f851f796983f72514b5a48ed03ddf137c1e50bc268daf27c7aefa13190
name: hwm
version: 0.5.0
github: nalchevanidze/hwm
workspace:
  libs:
    members:
    - golden
    - .
    prefix: hwm
environments:
  builder: stack
  default: stable
  profiles:
    ci-cabal:
      ghc: 9.6.3
      builder: cabal
      targets:
        nix: ignore
    ci-nix:
      ghc: 9.6.3
      builder: nix
    local-nix:
      ghc: 9.6.3
      builder: nix/cabal
    stable:
      ghc: 9.6.3
      stack:
        extra-deps:
          fastsum: 0.1.1.1
          list-extras: 0.4.1.6
          type-aligned: 0.9.6
  targets:
    packages: sync
    cabal: sync
    hie: sync
    nix: sync
    stack: sync
registry:
  aeson: '               >=  1.5.6.0     &&  <=  2.2.3.0'
  ansi-terminal: '       >=  0.11.1      &&  <=  1.1.5'
  async: '               >=  2.2.4       &&  <=  2.2.6'
  base: '                >=  4.7.0       &&  <   5.0.0'
  base16-bytestring: '   >=  1.0.2.0     &&  <=  1.0.2.0'
  bytestring: '          >=  0.10.4      &&  <=  0.12.2.0'
  Cabal: '               >=  3.8         &&  <=  3.16.1.0'
  containers: '          >=  0.4.2.1     &&  <=  0.8'
  cryptohash-sha256: '   >=  0.11.102.1  &&  <=  0.11.102.1'
  directory: '           >=  1.0         &&  <=  1.3.10.1'
  filepath: '            >=  1.1.0       &&  <=  1.5.5.0'
  Glob: '                >=  0.10.2      &&  <=  0.10.2'
  hpack: '               >=  0.34.6      &&  <=  0.39.3'
  hspec: '               >=  2.7.10      &&  <=  2.11.17'
  http-client: '         >=  0.6.4.1     &&  <=  0.7.19'
  http-types: '          >=  0.12.3.0    &&  <=  0.12.4'
  modern-uri: '          >=  0.3.4.3     &&  <=  0.3.6.1'
  mtl: '                 >   2.0.0       &&  <   2.6.0'
  optparse-applicative: '>=  0.16.1.0    &&  <=  0.19.0.0'
  process: '             >=  1.0.0       &&  <   2.0.0'
  relude: '              >=  0.7.0.0     &&  <=  1.2.2.2'
  req: '                 >=  3.9.0       &&  <=  3.13.4'
  retry: '               >=  0.8.1       &&  <=  0.9.3.1'
  stm: '                 >=  2.4         &&  <   2.6.0'
  temporary: '           >=  1.3         &&  <=  1.3'
  text: '                >=  1.2.3       &&  <   3.0.0'
  time: '                >=  1.9.2       &&  <   2.0.0'
  transformers: '        >=  0.5.6       &&  <   0.7.0'
  typed-process: '       >=  0.2.8.0     &&  <=  0.2.13.0'
  unordered-containers: '>=  0.2.16.0    &&  <=  0.2.21'
  yaml: '                >=  0.11.8.0    &&  <=  0.11.11.2'
  zip-archive: '         >=  0.4.2.1     &&  <=  0.4.3.2'
release:
  artifacts:
    hwm:
      ghc-options:
      - -O2
      - -split-sections
      - -optl-s
      - -threaded
      environments:
      - ci-nix
      - ci-cabal
      formats:
      - tar.gz
      - zip
      name-template: '{{binary}}-v{{version}}-{{os}}-{{arch}}'
      source: libs/_root_:hwm
  publish:
    main:
    - libs/_root_
scripts:
  format: sh scripts/format.sh
  format:fix: sh scripts/format.sh --fix
  lint: curl -sSL https://raw.github.com/ndmitchell/hlint/master/misc/run.sh | sh
    -s .
  test:update: GOLDEN_UPDATE=1 stack test hwm-golden
