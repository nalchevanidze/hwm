name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        shell: bash
        run: hwm build --fast

      - name: Test
        shell: bash
        run: hwm test --fast

  artifacts-cabal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    name: Artifact ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-artifacts

      - name: Test Archiving
        shell: bash
        run: hwm release artifacts

  artifacts-nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
    name: Artifact nix ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Preflight release derivation (nix)
        shell: bash
        run: nix build .#hwm-ci-nix-release --no-link --dry-run

      - name: Test Archiving (nix builder)
        shell: bash
        run: hwm release artifacts hwm --builder=nix --format=tar.gz

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: curl -sSL https://raw.githubusercontent.com/ndmitchell/hlint/master/misc/run.sh | sh -s .

      - name: Format
        run: curl -fsSL "https://raw.githubusercontent.com/nalchevanidze/hwm/main/scripts/format.sh" | bash -s

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}