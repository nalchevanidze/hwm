name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: 9.6.3
            env: stable
    runs-on: ubuntu-latest
    name: GHC ${{ matrix.ghc }} (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          ghc: ${{ matrix.ghc }}
      - name: Install dependencies
        shell: bash
        run: stack build --fast --test --only-dependencies
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          ghc: ${{ matrix.ghc }}

      - name: Build
        run: hwm build --fast

      - name: Test
        run: hwm test --fast

  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macOS, windows]
    name: Artifact ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          ghc: ${{ matrix.ghc }}
      - name: Install dependencies
        shell: bash
        run: stack build --fast --test --only-dependencies
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Test Archiving
        shell: bash
        run: hwm release artifacts

  hlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: curl -sSL https://raw.githubusercontent.com/ndmitchell/hlint/master/misc/run.sh | sh -s .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "https://raw.githubusercontent.com/nalchevanidze/hwm/main/scripts/format.sh" | bash -s

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
