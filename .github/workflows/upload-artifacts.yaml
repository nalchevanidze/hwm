# Manually trigger a release workflow to upload artifacts to a GitHub Release (use carefully).
name: Force Upload Artifacts to GitHub Release
on: workflow_dispatch

permissions:
  contents: write
  pull-requests: read

jobs:
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    name: Upload Artifact ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-artifacts

      - name: Preflight release derivation (nix)
        if: runner.os != 'Windows'
        shell: bash
        run: nix build .#hwm-ci-nix-release --no-link -L --print-build-logs

      - name: Upload Artifacts
        shell: bash
        run: hwm release artifacts --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
