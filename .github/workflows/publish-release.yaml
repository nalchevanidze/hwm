name: Publish Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: ${{ github.base_ref == 'main' && startsWith(github.head_ref, 'release-') && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish
        run: hwm release publish main
        env:
          HACKAGE_AUTH_TOKEN: ${{ secrets.HACKAGE_AUTH_TOKEN }}

      - name: Publish GitHub Release (from merged release PR)
        uses: nalchevanidze/relasy/actions/publish-release@v1.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  artifacts:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    name: Upload Artifact ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-artifacts

      - name: Preflight release derivation (nix)
        if: runner.os != 'Windows'
        shell: bash
        run: nix build .#hwm-ci-nix-release --no-link -L --print-build-logs

      - name: Upload Artifacts
        shell: bash
        run: hwm release artifacts --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
