name: Setup
description: 'Installs Nix and configures magic caching for HWM'

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Add Local Bin to GITHUB_PATH
      shell: bash
      run: |
        # Ensure the GitHub runner can find the binaries HWM installs
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Bootstrap and Install HWM
      shell: bash
      run: |
        # 1. We must compile HWM first using the Nix environment
        nix develop --command stack build

        # 2. Run the newly compiled HWM to install itself
        # (Using stack exec ensures we use the exact binary we just built)
        nix develop --command stack exec hwm -- install --fast

    - name: Verify Installation
      shell: bash
      run: |
        # Proves that ~/.local/bin/hwm is correctly wired up!
        hwm --version
