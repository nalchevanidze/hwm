name: test default-global
notes: |
  Scenario for test/default-global (command: test)
project: simple-bin
command: test
runner:
  bin:
    cabal:
      src: test/mocks/bin/cabal
      trace:
        env:
          - CABAL_PROJECT_FILE
        files:
          - ${CABAL_PROJECT_FILE}
    nix: test/mocks/bin/nix
    stack:
      src: test/mocks/bin/stack
      trace:
        env:
          - STACK_YAML
        files:
          - ${STACK_YAML}
  env:
    CI: "1"
    HWM_LOG_ID_FIXED: golden
expect:
  calls:
    - command: cabal test all
      env:
        CABAL_PROJECT_FILE: .hwm/matrix/cabal-default.project
      files:
        .hwm/matrix/cabal-default.project: |
          with-compiler: ghc-9.6.6
          packages:
            ../../foo
            ../../bar
