name: install stack-local-bin-path
notes: |
  Scenario for install/stack-local-bin-path (command: install)
project: simple-bin
command: install
runner:
  bin:
    cabal:
      src: test/mocks/bin/cabal
      trace:
        env:
          - CABAL_PROJECT_FILE
        files:
          - ${CABAL_PROJECT_FILE}
    nix: test/mocks/bin/nix
    stack:
      src: test/mocks/bin/stack
      trace:
        env:
          - STACK_YAML
        files:
          - ${STACK_YAML}
  env:
    CI: "1"
    HOME: .home
    HWM_LOG_ID_FIXED: golden
  path:
    - ${HOME}/.local/bin
expect:
  calls:
    - args:
      - install
      - --local-bin-path
      - .home/.local/bin
      env:
        STACK_YAML: .hwm/matrix/stack-default.yaml
      files:
        .hwm/matrix/stack-default.yaml: |
          resolver: lts-22.43
          packages:
          - ../../foo
          - ../../bar
          save-hackage-creds: false
      tool: stack
