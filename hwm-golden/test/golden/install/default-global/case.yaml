name: install default-global
notes: |
  Scenario for install/default-global (command: install)
project: simple-bin
command: install
runner:
  bin:
    cabal:
      src: test/mocks/bin/cabal
      trace:
        env:
          - CABAL_PROJECT_FILE
        files:
          - ${CABAL_PROJECT_FILE}
    nix: test/mocks/bin/nix
    stack:
      src: test/mocks/bin/stack
      trace:
        env:
          - STACK_YAML
        files:
          - ${STACK_YAML}
  env:
    CI: "1"
    HOME: .home
    HWM_LOG_ID_FIXED: golden
  path:
    - ${HOME}/.local/bin
expect:
  calls:
    - command: cabal install all:exes --install-method=copy --installdir .home/.local/bin
        --overwrite-policy=always
      env:
        CABAL_PROJECT_FILE: .hwm/matrix/cabal-default.project
      files:
        .hwm/matrix/cabal-default.project: |
          with-compiler: ghc-9.6.6
          packages:
            ../../foo
            ../../bar
