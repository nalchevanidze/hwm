name: install fast
notes: |
  Scenario for install/fast (command: install --fast)
project: simple-bin
command: install --fast
runner:
  bin:
    cabal: test/mocks/bin/cabal
    nix: test/mocks/bin/nix
    stack: test/mocks/bin/stack
  env:
    CI: 1
    HOME: .home
    HWM_LOG_ID_FIXED: golden
  path:
    - ${HOME}/.local/bin
expect:
  files:
  calls:
    - args:
      - install
      - all:exes
      - --install-method=copy
      - --installdir
      - .home/.local/bin
      - --overwrite-policy=always
      - --disable-optimization
      cabal_project_content: |
        with-compiler: ghc-9.6.6
        packages:
          ../../foo
          ../../bar
      cabal_project_file: cabal-default.project
      tool: cabal
