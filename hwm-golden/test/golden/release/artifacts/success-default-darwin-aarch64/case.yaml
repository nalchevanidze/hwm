command: release artifacts sample
expect:
  calls:
  - args:
    - install
    - foo
    - --install-method=copy
    - --installdir
    - .hwm/release/binaries/sample
    - --overwrite-policy=always
    - --ghc-options=-O2
    - --ghc-options=-split-sections
    - --ghc-options=-optl-s
    - --ghc-options=-threaded
    cabal_project_content: |
      with-compiler: ghc-9.6.6
      packages:
        ../../foo
        ../../bar
    cabal_project_file: cabal-default.project
    tool: cabal
name: release artifacts default output darwin aarch64 aliases
notes: |
  Builds local archive artifacts with System.Info-style aliases to verify normalization.
project: simple-bin
runner:
  bin:
    cabal: test/mocks/bin/cabal
    nix: test/mocks/bin/nix
    stack: test/mocks/bin/stack
  env:
    CI: '1'
    HOME: .home
    HWM_LOG_ID_FIXED: golden
    RUNNER_ARCH: aarch64
    RUNNER_OS: Darwin
  path:
  - ${HOME}/.local/bin
