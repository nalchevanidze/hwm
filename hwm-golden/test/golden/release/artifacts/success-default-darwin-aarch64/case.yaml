name: release artifacts default output darwin aarch64 aliases
notes: |
  Builds local archive artifacts with System.Info-style aliases to verify normalization.
project: simple-bin
command: release artifacts sample
runner:
  bin:
    cabal:
      src: test/mocks/bin/cabal
      trace:
        env:
          - CABAL_PROJECT_FILE
        files:
          - ${CABAL_PROJECT_FILE}
    nix: test/mocks/bin/nix
    stack:
      src: test/mocks/bin/stack
      trace:
        env:
          - STACK_YAML
        files:
          - ${STACK_YAML}
  env:
    CI: "1"
    HOME: .home
    HWM_LOG_ID_FIXED: golden
    RUNNER_ARCH: aarch64
    RUNNER_OS: Darwin
  path:
    - ${HOME}/.local/bin
expect:
  calls:
    - command: cabal install foo --install-method=copy --installdir .hwm/release/binaries/sample
        --overwrite-policy=always --ghc-options=-O2 --ghc-options=-split-sections --ghc-options=-optl-s
        --ghc-options=-threaded
      env:
        CABAL_PROJECT_FILE: .hwm/matrix/cabal-default.project
      files:
        .hwm/matrix/cabal-default.project: |
          with-compiler: ghc-9.6.6
          packages:
            ../../foo
            ../../bar
