name: release artifacts multi-format from config
notes: |
  Uses config-defined formats (zip and tar.gz) for artifact generation.
project: simple-bin
command: release artifacts sample
runner:
  bin:
    cabal: test/mocks/bin/cabal
    nix: test/mocks/bin/nix
    stack: test/mocks/bin/stack
  env:
    CI: "1"
    HOME: .home
    HWM_LOG_ID_FIXED: golden
    RUNNER_ARCH: arm64
    RUNNER_OS: macos
  path:
    - ${HOME}/.local/bin
expect:
  calls:
    - args:
      - install
      - foo
      - --install-method=copy
      - --installdir
      - .hwm/release/binaries/sample
      - --overwrite-policy=always
      - --ghc-options=-O2
      - --ghc-options=-split-sections
      - --ghc-options=-optl-s
      - --ghc-options=-threaded
      cabal_project_content: |
        with-compiler: ghc-9.6.6
        packages:
          ../../foo
          ../../bar
      cabal_project_file: cabal-default.project
      tool: cabal
