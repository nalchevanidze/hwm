command: release artifacts sample
runner:
  path:
    - ${HOME}/.local/bin
  bin:
    cabal: test/mocks/bin/cabal
    stack: test/mocks/bin/stack
    nix: test/mocks/bin/nix
  env:
    CI: "1"
    HOME: .home
    RUNNER_ARCH: arm64
    RUNNER_OS: macos
    HWM_LOG_ID_FIXED: golden
expect:
  calls:
  - args:
    - install
    - foo
    - --install-method=copy
    - --installdir
    - .hwm/release/binaries/sample
    - --overwrite-policy=always
    - --ghc-options=-O2
    - --ghc-options=-split-sections
    - --ghc-options=-optl-s
    - --ghc-options=-threaded
    cabal_project_content: |
      with-compiler: ghc-9.6.6
      packages:
        ../../foo
        ../../bar
    cabal_project_file: cabal-default.project
    tool: cabal
name: release artifacts default output
notes: |
  Builds local archive artifacts into the default .hwm/dist directory.
project: simple-bin
