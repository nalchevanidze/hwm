name: release artifacts rejects non-listed active environment
notes: |
  Active environment is not included in artifact target environments policy.
  Validation must fail before any builder command runs.
project: simple
command: release artifacts sample --builder=nix
runner:
  env:
    CI: "1"
  bin:
    nix: test/mocks/bin/nix
expect:
  failure: true
  calls:
    - command: nix build .#foo-stable-release -o .hwm/release/binaries/sample/result
