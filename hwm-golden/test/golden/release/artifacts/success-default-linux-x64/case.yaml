name: release artifacts default output linux x64
notes: |
  Builds local archive artifacts with RUNNER_OS/RUNNER_ARCH override using GitHub-style names.
project: simple-bin
command: release artifacts sample
runner:
  bin:
    cabal:
      src: test/mocks/bin/cabal
      trace:
        env:
          - CABAL_PROJECT_FILE
        files:
          - ${CABAL_PROJECT_FILE}
    nix: test/mocks/bin/nix
    stack:
      src: test/mocks/bin/stack
      trace:
        env:
          - STACK_YAML
        files:
          - ${STACK_YAML}
  env:
    CI: "1"
    HOME: .home
    HWM_LOG_ID_FIXED: golden
    RUNNER_ARCH: X64
    RUNNER_OS: Linux
  path:
    - ${HOME}/.local/bin
expect:
  calls:
    - args:
      - install
      - foo
      - --install-method=copy
      - --installdir
      - .hwm/release/binaries/sample
      - --overwrite-policy=always
      - --ghc-options=-O2
      - --ghc-options=-split-sections
      - --ghc-options=-optl-s
      - --ghc-options=-threaded
      env:
        CABAL_PROJECT_FILE: .hwm/matrix/cabal-default.project
      files:
        .hwm/matrix/cabal-default.project: |
          with-compiler: ghc-9.6.6
          packages:
            ../../foo
            ../../bar
      tool: cabal
