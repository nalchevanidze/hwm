name: release artifacts omitted environments allowed and builder succeeds
notes: |
  Omitting environments is allowed; artifact generation proceeds with nix builder.
  The nix mock simulates Nix result symlink output.
project: simple
command: release artifacts sample --builder=nix
runner:
  bin:
    nix: test/mocks/bin/nix
  env:
    CI: "1"
    HWM_LOG_ID_FIXED: golden
expect:
  calls:
    - command: nix build .#foo-stable-release -o .hwm/release/binaries/sample/result
