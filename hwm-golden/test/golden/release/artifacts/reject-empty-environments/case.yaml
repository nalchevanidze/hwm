name: release artifacts rejects empty environments policy
notes: |
  Artifact target explicitly disables all environments.
  Validation must fail before any builder command runs.
project: simple
command: release artifacts sample --builder=nix
runner:
  bin:
    nix: test/mocks/bin/nix
  env:
    CI: "1"
    HWM_LOG_ID_FIXED: golden
expect:
  failure: true
  calls: []
