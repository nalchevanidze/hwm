name: build env-all
notes: |
  Scenario for build/env-all (command: build --env all)
project: simple-bin
command: build --env all
runner:
  bin:
    cabal:
      src: test/mocks/bin/cabal
      trace:
        env:
          - CABAL_PROJECT_FILE
        files:
          - ${CABAL_PROJECT_FILE}
    nix: test/mocks/bin/nix
    stack:
      src: test/mocks/bin/stack
      trace:
        env:
          - STACK_YAML
        files:
          - ${STACK_YAML}
  env:
    CI: "1"
    HWM_LOG_ID_FIXED: golden
expect:
  calls:
    - args:
      - build
      - all
      env:
        CABAL_PROJECT_FILE: .hwm/matrix/cabal-ci.project
      files:
        .hwm/matrix/cabal-ci.project: |
          with-compiler: ghc-9.4.8
          packages:
            ../../foo
            ../../bar
      tool: cabal
    - args:
      - build
      - all
      env:
        CABAL_PROJECT_FILE: .hwm/matrix/cabal-default.project
      files:
        .hwm/matrix/cabal-default.project: |
          with-compiler: ghc-9.6.6
          packages:
            ../../foo
            ../../bar
      tool: cabal
