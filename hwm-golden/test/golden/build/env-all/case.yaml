name: build env-all
notes: |
  Scenario for build/env-all (command: build --env all)
project: simple-bin
command: build --env all
runner:
  bin:
    cabal: test/mocks/bin/cabal
    nix: test/mocks/bin/nix
    stack: test/mocks/bin/stack
  env:
    CI: "1"
    HWM_LOG_ID_FIXED: golden
expect:
  files:
  calls:
    - args:
      - build
      - all
      cabal_project_content: |
        with-compiler: ghc-9.4.8
        packages:
          ../../foo
          ../../bar
      cabal_project_file: cabal-ci.project
      tool: cabal
    - args:
      - build
      - all
      cabal_project_content: |
        with-compiler: ghc-9.6.6
        packages:
          ../../foo
          ../../bar
      cabal_project_file: cabal-default.project
      tool: cabal
