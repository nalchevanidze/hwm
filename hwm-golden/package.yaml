name: hwm-golden
version: 0.5.0
github: nalchevanidze/hwm
license: MIT
author: Daviti Nalchevanidze
category: Development
synopsis: Haskell Workspace Manager - Orchestrates Stack, Cabal, and HLS
maintainer: d.nalchevanidze@gmail.com
copyright: (c) 2026 Daviti Nalchevanidze
license-file: LICENSE
description: |
  HWM (Haskell Workspace Manager) manages multi-package Haskell projects by
  generating and synchronizing configuration files for Stack, Cabal, Hpack, and HLS
  from a single source of truth (hwm.yaml). It handles dependency management,
  build matrices across GHC versions, and coordinated package releases.
extra-source-files:
- README.md
dependencies:
  aeson: '    >=  1.5.6.0   &&  <=  2.2.3.0'
  base: '     >=  4.7.0     &&  <   5.0.0'
  directory: '>=  1.0       &&  <=  1.3.10.1'
  filepath: ' >=  1.1.0     &&  <=  1.5.5.0'
  Glob: '     >=  0.10.2    &&  <=  0.10.2'
  hspec: '    >=  2.7.10    &&  <=  2.11.17'
  hwm: '      >=  0.5.0     &&  <   0.6.0'
  process: '  >=  1.0.0     &&  <   2.0.0'
  relude: '   >=  0.7.0.0   &&  <=  1.2.2.2'
  temporary: '>=  1.3       &&  <=  1.3'
  text: '     >=  1.2.3     &&  <   3.0.0'
  time: '     >=  1.9.2     &&  <   2.0.0'
  yaml: '     >=  0.11.8.0  &&  <=  0.11.11.2'
library:
  source-dirs: src
  ghc-options: -Wall
  exposed-modules:
  - HWM.Golden
  - HWM.Golden.Assertions
  - HWM.Golden.Exec
  - HWM.Golden.Filesystem
  - HWM.Golden.Scanning
  - HWM.Golden.Types
  other-modules:
  - HWM.Golden.CaseYaml
  - HWM.Golden.Changes
  - HWM.Golden.Json
tests:
  hwm-golden-sync:
    main: Main.hs
    source-dirs: test
    ghc-options: -Wall
    dependencies:
      hspec: '     >=  2.7.10  &&  <=  2.11.17'
      hwm-golden: '>=  0.5.0   &&  <   0.6.0'
    build-tools: hwm:hwm
when:
- dependencies:
    unix: '     >=  2.7.0.0   &&  <   2.9.0.0'
  condition: '!os(windows)'
